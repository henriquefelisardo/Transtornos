<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSM-5</title>
    <!-- Bootstrap CSS for basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; color: #212529; font-family: monospace; 
            display: flex; flex-direction: column; min-height: 100vh;
            margin: 0; padding: 10px 0;
        }
        body::before, body::after { content: ''; flex: 1; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; flex-shrink: 0; }
        .card { background-color: #ffffff; border: 1px solid #dee2e6; color: #212529; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header-title { color: #0d6efd; font-weight: bold; font-size: clamp(1.2rem, 4vw, 1.8rem); margin-bottom: 0; }
        .option-active { background-color: #0d6efd !important; color: white !important; font-weight: bold; }
        .option-btn { background-color: transparent; border: 1px solid #0d6efd; color: #0d6efd; transition: all 0.2s ease-in-out; }
        .option-btn:hover { background-color: rgba(13, 110, 253, 0.1); }
        @media (min-width: 576px) {
            .option-btn { flex: 1 1 0; }
        }
        @media (max-width: 575.98px) {
            .option-btn { flex: 1 1 auto; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-2">
            <h2 class="header-title m-0 d-block d-md-inline-block align-middle">🧠 DSM-5 - Inferência Probabilística</h2>
            {% if request.path != '/' %}
            <a href="{% url 'index' %}" onclick="if(!confirm('Tem certeza que deseja reiniciar o teste e voltar ao menu inicial? Todo o seu progresso será perdido.')){event.preventDefault();}" class="btn btn-outline-danger btn-sm ms-md-3 mt-2 mt-md-0 align-middle" title="Voltar ao Menu">🔄 Início</a>
            {% endif %}
        </div>
        <hr style="border-color: #dee2e6; margin: 1rem 0;">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
