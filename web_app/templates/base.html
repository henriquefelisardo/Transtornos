<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator DSM-5</title>
    <!-- Bootstrap CSS for basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #f8f9fa; font-family: monospace; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: white; }
        .header-title { color: #0dcaf0; font-weight: bold; }
        .option-active { background-color: #0dcaf0 !important; color: black !important; font-weight: bold; }
        .option-btn { background-color: transparent; border: 1px solid #0dcaf0; color: #0dcaf0; transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="header-title">🧠 Akinator DSM-5 - Inferência Probabilística</h2>
            <hr style="border-color: #333;">
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
