33C3FF", "font": {"color": "white"}, "id": "q_discurso_desorganizado", "label": "q_discurso_desorganizado", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_discurso_desorganizado):\u003c/b\u003e\u003cbr\u003eAs pessoas frequentemente dizem que o\u003cbr\u003eque voc\u00ea fala parece muito confuso,\u003cbr\u003eincoerente ou que voc\u00ea muda de assunto\u003cbr\u003ede forma estranha."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_comportamento_desorganizado", "label": "q_comportamento_desorganizado", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_comportamento_desorganizado):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem tido comportamentos muito\u003cbr\u003eestranhos, grande agita\u00e7\u00e3o ou momentos\u003cbr\u003eem que fica completamente paralisado e\u003cbr\u003esem rea\u00e7\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_psicotico_duracao_breve", "label": "q_psicotico_duracao_breve", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_psicotico_duracao_breve):\u003c/b\u003e\u003cbr\u003eEsses epis\u00f3dios de ouvir vozes ou\u003cbr\u003edel\u00edrios duraram muito pouco tempo,\u003cbr\u003eentre 1 dia e 1 m\u00eas, e depois voc\u00ea\u003cbr\u003evoltou totalmente ao normal."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_psicotico_retorno_normal", "label": "q_psicotico_retorno_normal", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_psicotico_retorno_normal):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se recuperou totalmente ap\u00f3s esses\u003cbr\u003eepis\u00f3dios."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_sintomas_negativos", "label": "q_sintomas_negativos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_sintomas_negativos):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem sentido uma enorme falta de\u003cbr\u003evontade de fazer qualquer coisa e\u003cbr\u003epercebe que seu rosto ou voz est\u00e3o sem\u003cbr\u003eexpress\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_psicotico_duracao_media", "label": "q_psicotico_duracao_media", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_psicotico_duracao_media):\u003c/b\u003e\u003cbr\u003eEsses sintomas estranhos duraram de 1 a\u003cbr\u003e6 meses."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_psicotico_queda_funcionamento", "label": "q_psicotico_queda_funcionamento", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_psicotico_queda_funcionamento):\u003c/b\u003e\u003cbr\u003eDesde que os problemas come\u00e7aram, sua\u003cbr\u003ecapacidade de trabalhar, estudar ou se\u003cbr\u003erelacionar caiu drasticamente."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_psicotico_duracao_longa", "label": "q_psicotico_duracao_longa", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_psicotico_duracao_longa):\u003c/b\u003e\u003cbr\u003eEsses sintomas ou o comportamento\u003cbr\u003eestranho j\u00e1 persistem de forma cont\u00ednua\u003cbr\u003epor mais de 6 meses."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_episodio_maniaco", "label": "q_episodio_maniaco", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_episodio_maniaco):\u003c/b\u003e\u003cbr\u003eVoc\u00ea j\u00e1 teve pelo menos uma vez na vida\u003cbr\u003eum per\u00edodo de uma semana ou mais onde se\u003cbr\u003esentiu anormalmente euf\u00f3rico,\u003cbr\u003e\u0027acelerado\u0027 ou muito irritado."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_aumento_energia", "label": "q_aumento_energia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_aumento_energia):\u003c/b\u003e\u003cbr\u003eNesse per\u00edodo voc\u00ea teve um aumento\u003cbr\u003eexagerado de energia e agita\u00e7\u00e3o para\u003cbr\u003efazer v\u00e1rias coisas ao mesmo tempo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_mania_duracao", "label": "q_mania_duracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_mania_duracao):\u003c/b\u003e\u003cbr\u003eA euforia e acelera\u00e7\u00e3o persistiram pela\u003cbr\u003emaior parte do dia durante toda aquela\u003cbr\u003esemana."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_autoestima_inflada", "label": "q_autoestima_inflada", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_autoestima_inflada):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se sentiu com uma autoconfian\u00e7a\u003cbr\u003eexagerada, grandiosidade ou achando que\u003cbr\u003etinha talentos excepcionais."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_reducao_sono", "label": "q_reducao_sono", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_reducao_sono):\u003c/b\u003e\u003cbr\u003eNessa fase, voc\u00ea precisava dormir muito\u003cbr\u003epouco (ex: 3 horas) e mesmo assim\u003cbr\u003eacordava descansado."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_loquacidade", "label": "q_loquacidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_loquacidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea falava muito mais e mais r\u00e1pido do\u003cbr\u003eque o normal, quase sem conseguir parar."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_fuga_ideias", "label": "q_fuga_ideias", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_fuga_ideias):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sentia que seus pensamentos estavam\u003cbr\u003evoando ou acelerados a ponto de se\u003cbr\u003eatropelarem."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_distratibilidade", "label": "q_distratibilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_distratibilidade):\u003c/b\u003e\u003cbr\u003eSua aten\u00e7\u00e3o desviava facilmente para\u003cbr\u003equalquer est\u00edmulo \u00e0 sua volta."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_risco_excessivo", "label": "q_risco_excessivo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_risco_excessivo):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tomou atitudes por impulso com\u003cbr\u003egrandes riscos, como compras exageradas,\u003cbr\u003esexo descuidado ou investimentos\u003cbr\u003einsensatos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_episodio_hipomaniaco", "label": "q_episodio_hipomaniaco", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_episodio_hipomaniaco):\u003c/b\u003e\u003cbr\u003eVoc\u00ea j\u00e1 teve um per\u00edodo mais curto\u003cbr\u003e(cerca de 4 dias) de mimforia, mais\u003cbr\u003eenergia e agita\u00e7\u00e3o, mas que n\u00e3o chegou a\u003cbr\u003eprejudicar gravemente sua vida ou te\u003cbr\u003einternar."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_episodio_depressivo", "label": "q_episodio_depressivo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_episodio_depressivo):\u003c/b\u003e\u003cbr\u003eVoc\u00ea j\u00e1 teve \u00e9pocas em que ficou\u003cbr\u003eprofundamente triste e perdeu o\u003cbr\u003einteresse em tudo por semanas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_sem_mania", "label": "q_sem_mania", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_sem_mania):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem certeza de que nunca teve um\u003cbr\u003eepis\u00f3dio grave de mimforia ou agita\u00e7\u00e3o\u003cbr\u003eextrema que o fizesse perder o controle\u003cbr\u003eou ir para o hospital."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_hipomania_humor", "label": "q_hipomania_humor", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_hipomania_humor):\u003c/b\u003e\u003cbr\u003eNaquela fase mais leve (de 4 dias), seu\u003cbr\u003ehumor ficou mais euf\u00f3rico ou irritado\u003cbr\u003eque o normal."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_hipomania_energia", "label": "q_hipomania_energia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_hipomania_energia):\u003c/b\u003e\u003cbr\u003eSua energia e ritmo de atividades\u003cbr\u003eficaram visivelmente mais intensos\u003cbr\u003enaqueles dias."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_hipomania_sem_prejuizo", "label": "q_hipomania_sem_prejuizo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_hipomania_sem_prejuizo):\u003c/b\u003e\u003cbr\u003eEssas mudan\u00e7as n\u00e3o chegaram a causar\u003cbr\u003edanos graves na sua rotina, certo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_depressao_humor", "label": "q_depressao_humor", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_depressao_humor):\u003c/b\u003e\u003cbr\u003eNa fase triste, o des\u00e2nimo ocorria a\u003cbr\u003emaior parte do dia, quase todos os dias."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_peso_apetite", "label": "q_peso_apetite", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_peso_apetite):\u003c/b\u003e\u003cbr\u003eHouve altera\u00e7\u00f5es muito fortes no seu\u003cbr\u003epeso ou no apetite sem motivo \u00f3bvio."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_insonia_hipersonia", "label": "q_insonia_hipersonia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_insonia_hipersonia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea teve muita dificuldade para dormir\u003cbr\u003eou sentia necessidade de dormir quase o\u003cbr\u003edia todo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_depressao_secundarios", "label": "q_depressao_secundarios", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_depressao_secundarios):\u003c/b\u003e\u003cbr\u003eNesse per\u00edodo voc\u00ea sentiu muito cansa\u00e7o,\u003cbr\u003edificuldade para pensar, ou sentia-se\u003cbr\u003ein\u00fatil."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_humor_deprimido", "label": "q_humor_deprimido", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_humor_deprimido):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem se sentido triste, vazio ou sem\u003cbr\u003eesperan\u00e7a na maior parte do dia, quase\u003cbr\u003etodos os dias."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_perda_interesse", "label": "q_perda_interesse", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_perda_interesse):\u003c/b\u003e\u003cbr\u003eVoc\u00ea perdeu quase todo o interesse ou\u003cbr\u003eprazer nas atividades que antes gostava."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_depressao_duracao", "label": "q_depressao_duracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_depressao_duracao):\u003c/b\u003e\u003cbr\u003eEssa tristeza forte e falta de energia\u003cbr\u003ej\u00e1 duram no m\u00ednimo 2 semanas seguidas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_agitacao_retardo", "label": "q_agitacao_retardo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_agitacao_retardo):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se sente ou se move de forma muito\u003cbr\u003eagitada ou, pelo contr\u00e1rio, extremamente\u003cbr\u003emais lento do que o seu normal."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_fadiga", "label": "q_fadiga", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_fadiga):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente um cansa\u00e7o frequente ou perda\u003cbr\u003ede energia em quase todos os dias."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_inutilidade_culpa", "label": "q_inutilidade_culpa", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_inutilidade_culpa):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem carregado uma culpa muito\u003cbr\u003eexagerada ou se sentido completamente\u003cbr\u003ein\u00fatil."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_concentracao_diminuida", "label": "q_concentracao_diminuida", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_concentracao_diminuida):\u003c/b\u003e\u003cbr\u003eSua capacidade de raciocinar, focar ou\u003cbr\u003etomar decis\u00f5es piorou muito nesse\u003cbr\u003eper\u00edodo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_ideacao_suicida", "label": "q_ideacao_suicida", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_ideacao_suicida):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem pensado repetidamente em morte,\u003cbr\u003eou tem ideias/planos de tirar a pr\u00f3pria\u003cbr\u003evida."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_ansiedade_excessiva", "label": "q_ansiedade_excessiva", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_ansiedade_excessiva):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem preocupa\u00e7\u00f5es constantes e uma\u003cbr\u003eexpectativa ruim de que o pior vai\u003cbr\u003eacontecer com v\u00e1rias coisas do dia a dia\u003cbr\u003e(trabalho, sa\u00fade, fam\u00edlia), de uma forma\u003cbr\u003eque te deixa paralisado."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_ansiedade_duracao", "label": "q_ansiedade_duracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_ansiedade_duracao):\u003c/b\u003e\u003cbr\u003eEssa ansiedade e preocupa\u00e7\u00e3o acontecem\u003cbr\u003ena maioria dos dias h\u00e1 pelo menos 6\u003cbr\u003emeses."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_ansiedade_incontrolavel", "label": "q_ansiedade_incontrolavel", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_ansiedade_incontrolavel):\u003c/b\u003e\u003cbr\u003eVoc\u00ea acha muito dif\u00edcil conseguir\u003cbr\u003econtrolar e afastar esses pensamentos de\u003cbr\u003epreocupa\u00e7\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_inquieta_nervos", "label": "q_inquieta_nervos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_inquieta_nervos):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma se sentir impaciente,\u003cbr\u003einquieto ou com os nervos \u00e0 flor da\u003cbr\u003epele."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_fatigabilidade", "label": "q_fatigabilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_fatigabilidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se cansa com facilidade por causa\u003cbr\u003eda ansiedade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_branco_mente", "label": "q_branco_mente", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_branco_mente):\u003c/b\u003e\u003cbr\u003eA preocupa\u00e7\u00e3o faz com que sua mente\u003cbr\u003efique com \u0027branco\u0027 ou com dificuldade de\u003cbr\u003econcentra\u00e7\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_irritabilidade", "label": "q_irritabilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_irritabilidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se sente mais irritado e pavio\u003cbr\u003ecurto com facilidade por causa da\u003cbr\u003eansiedade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tensao_muscular", "label": "q_tensao_muscular", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tensao_muscular):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sofre com tens\u00e3o, rigidez ou dores\u003cbr\u003emusculares devido \u00e0 ansiedade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_sono_ansioso", "label": "q_sono_ansioso", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_sono_ansioso):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem problemas para pegar no sono,\u003cbr\u003eacorda no meio da noite ou acorda\u003cbr\u003ecansado por causa da apreens\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_ansiedade_sofrimento", "label": "q_ansiedade_sofrimento", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_ansiedade_sofrimento):\u003c/b\u003e\u003cbr\u003eEssa ansiedade causa sofrimento claro ou\u003cbr\u003eprejudica bastante sua rotina."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_ataques_panico", "label": "q_ataques_panico", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_ataques_panico):\u003c/b\u003e\u003cbr\u003eVoc\u00ea j\u00e1 teve ataques de p\u00e2nico (medo\u003cbr\u003erepentino e intenso) que surgiram do\u003cbr\u003enada, de forma inesperada e que se\u003cbr\u003erepetiram."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_medo_novos_ataques", "label": "q_medo_novos_ataques", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_medo_novos_ataques):\u003c/b\u003e\u003cbr\u003eVoc\u00ea fica pelo menos 1 m\u00eas sentindo\u003cbr\u003emuito medo de ter uma nova crise de\u003cbr\u003ep\u00e2nico a qualquer momento."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitacao_panico", "label": "q_evitacao_panico", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitacao_panico):\u003c/b\u003e\u003cbr\u003eVoc\u00ea mudou a forma como vive (como\u003cbr\u003eevitar lugares ou situa\u00e7\u00f5es) por receio\u003cbr\u003ede que aconte\u00e7a outra crise."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_fisico_coracao", "label": "q_panico_fisico_coracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_fisico_coracao):\u003c/b\u003e\u003cbr\u003eNa hora do ataque, voc\u00ea sente\u003cbr\u003epalpita\u00e7\u00f5es, cora\u00e7\u00e3o acelerado ou\u003cbr\u003ebatendo forte no peito."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_fisico_tremor", "label": "q_panico_fisico_tremor", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_fisico_tremor):\u003c/b\u003e\u003cbr\u003eNas crises, voc\u00ea tem suores exagerados,\u003cbr\u003etremores ou abalos pelo corpo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_fisico_ar", "label": "q_panico_fisico_ar", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_fisico_ar):\u003c/b\u003e\u003cbr\u003eDurante a crise, voc\u00ea sente falta de ar\u003cbr\u003erepentina, sufocamento ou dificuldade de\u003cbr\u003erespirar."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_fisico_dor", "label": "q_panico_fisico_dor", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_fisico_dor):\u003c/b\u003e\u003cbr\u003eNa crise, voc\u00ea sente dor ou aperto no\u003cbr\u003epeito, asfixia ou tontura."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_fisico_enjoo", "label": "q_panico_fisico_enjoo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_fisico_enjoo):\u003c/b\u003e\u003cbr\u003eNa hora da crise, ocorrem enjoos,\u003cbr\u003edesconforto abdominal ou uma sensa\u00e7\u00e3o de\u003cbr\u003edesmaio."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_fisico_calafrio", "label": "q_panico_fisico_calafrio", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_fisico_calafrio):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem calafrios, ondas de calor ou\u003cbr\u003eformigamentos pelo corpo no momento do\u003cbr\u003eataque."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_panico_psicologico", "label": "q_panico_psicologico", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_panico_psicologico):\u003c/b\u003e\u003cbr\u003eNas crises, voc\u00ea tem a forte impress\u00e3o\u003cbr\u003ede que est\u00e1 enlouquecendo, perdendo o\u003cbr\u003econtrole ou de que vai morrer em\u003cbr\u003einstantes."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_obsessoes", "label": "q_obsessoes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_obsessoes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea \u00e9 frequentemente invadido por\u003cbr\u003epensamentos, imagens ou impulsos\u003cbr\u003erepetitivos que n\u00e3o quer ter e que\u003cbr\u003ecausam ansiedade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_compulsoes", "label": "q_compulsoes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_compulsoes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se sente for\u00e7ado a executar\u003cbr\u003ecomportamentos repetitivos ou rituais\u003cbr\u003ementais para aliviar essa ansiedade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tentativa_ignorar_obsessoes", "label": "q_tentativa_ignorar_obsessoes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tentativa_ignorar_obsessoes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tenta afastar ou neutralizar esses\u003cbr\u003epensamentos inc\u00f4modos fazendo as a\u00e7\u00f5es\u003cbr\u003erepetitivas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_compulsoes_objetivo", "label": "q_compulsoes_objetivo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_compulsoes_objetivo):\u003c/b\u003e\u003cbr\u003eA principal inten\u00e7\u00e3o desses rituais \u00e9\u003cbr\u003ealiviar a sua ang\u00fastia ou evitar\u003cbr\u003emagicamente que algo ruim aconte\u00e7a."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_compulsoes_excessivas", "label": "q_compulsoes_excessivas", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_compulsoes_excessivas):\u003c/b\u003e\u003cbr\u003eSuas a\u00e7\u00f5es para neutralizar os\u003cbr\u003epensamentos s\u00e3o exageradas ou n\u00e3o t\u00eam\u003cbr\u003euma liga\u00e7\u00e3o l\u00f3gica com o perigo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_toc_tempo", "label": "q_toc_tempo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_toc_tempo):\u003c/b\u003e\u003cbr\u003eEssas repeti\u00e7\u00f5es ou pensamentos gastam\u003cbr\u003emuito do seu tenhopo (mais de uma hora\u003cbr\u003epor dia)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_toc_sofrimento", "label": "q_toc_sofrimento", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_toc_sofrimento):\u003c/b\u003e\u003cbr\u003eEsse problema causa sofrimento\u003cbr\u003esignificativo ou atrapalha bastante a\u003cbr\u003esua vida profissional ou social."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_exposicao", "label": "q_trauma_exposicao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_exposicao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea esteve exposto, presenciou ou\u003cbr\u003edescobriu sobre alguma amea\u00e7a de morte\u003cbr\u003ereal, les\u00e3o grave ou viol\u00eancia sexual."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_intrusao", "label": "q_trauma_intrusao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_intrusao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea revive o trauma atrav\u00e9s de\u003cbr\u003elembran\u00e7as ruins inesperadas, flashbacks\u003cbr\u003eou pesadelos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_evitacao", "label": "q_trauma_evitacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_evitacao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea faz um esfor\u00e7o constante para\u003cbr\u003eevitar mem\u00f3rias, lugares ou pessoas que\u003cbr\u003eo lembrem do trauma."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_cognicao", "label": "q_trauma_cognicao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_cognicao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea notou altera\u00e7\u00f5es negativas nos seus\u003cbr\u003epensamentos e no humor em rela\u00e7\u00e3o a si\u003cbr\u003epr\u00f3prio e ao mundo ap\u00f3s o evento."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_amnesia", "label": "q_trauma_amnesia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_amnesia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea perdeu a capacidade de se lembrar\u003cbr\u003ede alguma parte muito importante do\u003cbr\u003etrauma."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_crencas", "label": "q_trauma_crencas", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_crencas):\u003c/b\u003e\u003cbr\u003eVoc\u00ea mant\u00e9m cren\u00e7as fortemente negativas\u003cbr\u003esobre voc\u00ea mesmo, sobre os outros ou\u003cbr\u003esobre o mundo desde o trauma."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_reatividade", "label": "q_trauma_reatividade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_reatividade):\u003c/b\u003e\u003cbr\u003eSua rea\u00e7\u00e3o de alerta mudou e agora voc\u00ea\u003cbr\u003e\u00e9 muito irritado, hipervigilante ou tem\u003cbr\u003eacessos de raiva constantes."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_imprudencia", "label": "q_trauma_imprudencia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_imprudencia):\u003c/b\u003e\u003cbr\u003eDesde o trauma voc\u00ea come\u00e7ou a agir de\u003cbr\u003emodo imprudente, com risco pessoal e\u003cbr\u003eatitudes autodestrutivas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_sono_concentracao", "label": "q_trauma_sono_concentracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_sono_concentracao):\u003c/b\u003e\u003cbr\u003eDesde o trauma voc\u00ea passou a ter\u003cbr\u003eproblemas de concentra\u00e7\u00e3o frequentes e\u003cbr\u003esobressaltos exagerados."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_trauma_duracao", "label": "q_trauma_duracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_trauma_duracao):\u003c/b\u003e\u003cbr\u003eA dura\u00e7\u00e3o dessas lembran\u00e7as ruins, da\u003cbr\u003eirritabilidade e do sofrimento dura h\u00e1\u003cbr\u003emais de 1 m\u00eas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_desconfianca", "label": "q_paranoide_desconfianca", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_desconfianca):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma desconfiar das pessoas no\u003cbr\u003egeral, muitas vezes sem provas,\u003cbr\u003eacreditando que querem engan\u00e1-lo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_intencoes", "label": "q_paranoide_intencoes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_intencoes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea quase sempre enxerga as inten\u00e7\u00f5es\u003cbr\u003edos outros como maldosas contra voc\u00ea."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tp_inicio", "label": "q_tp_inicio", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tp_inicio):\u003c/b\u003e\u003cbr\u003eSeu padr\u00e3o geral de ser e reagir se\u003cbr\u003efirmou de forma persistente logo no\u003cbr\u003ein\u00edcio da sua vida adulta."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_explorado", "label": "q_paranoide_explorado", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_explorado):\u003c/b\u003e\u003cbr\u003eVoc\u00ea suspeita muito, sem evid\u00eancia\u003cbr\u003econcreta, de que est\u00e1 sendo explorado ou\u003cbr\u003eprejudicado pelas pessoas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_lealdade", "label": "q_paranoide_lealdade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_lealdade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem d\u00favidas injustificadas sobre a\u003cbr\u003elealdade ou a confian\u00e7a dos seus amigos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_confiar", "label": "q_paranoide_confiar", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_confiar):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem muito medo de confiar\u003cbr\u003einforma\u00e7\u00f5es aos outros, achando que\u003cbr\u003eusar\u00e3o isso contra voc\u00ea."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_significados", "label": "q_paranoide_significados", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_significados):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma interpretar cr\u00edticas\u003cbr\u003ehumilhantes ou amea\u00e7as ocultas em\u003cbr\u003eobserva\u00e7\u00f5es normais do dia a dia."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_rancor", "label": "q_paranoide_rancor", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_rancor):\u003c/b\u003e\u003cbr\u003eVoc\u00ea guarda rancor intensamente e tem\u003cbr\u003egrande dificuldade em perdoar qualquer\u003cbr\u003eofensa."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_ataques", "label": "q_paranoide_ataques", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_ataques):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente que seu car\u00e1ter est\u00e1 sempre\u003cbr\u003esendo atacado e reage rapidamente com\u003cbr\u003eraiva ou agress\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_paranoide_fidelidade", "label": "q_paranoide_fidelidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_paranoide_fidelidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea suspeita repetidamente, sem motivos\u003cbr\u003ereais, de que seu parceiro ou parceira\u003cbr\u003eest\u00e1 sendo infiel."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_distanciamento", "label": "q_esquizoide_distanciamento", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_distanciamento):\u003c/b\u003e\u003cbr\u003eVoc\u00ea mant\u00e9m um padr\u00e3o amplo de\u003cbr\u003edistanciamento e isolamento das rela\u00e7\u00f5es\u003cbr\u003esociais."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_restricao_afeto", "label": "q_esquizoide_restricao_afeto", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_restricao_afeto):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem uma faixa muito limitada para\u003cbr\u003eexpressar emo\u00e7\u00f5es, parecendo frio ou\u003cbr\u003edistante para os outros."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_desejo_relacoes", "label": "q_esquizoide_desejo_relacoes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_desejo_relacoes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente que realmente n\u00e3o deseja e\u003cbr\u003en\u00e3o tem vontade de ter rela\u00e7\u00f5es \u00edntimas\u003cbr\u003eou ser pr\u00f3ximo da fam\u00edlia."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_atividades", "label": "q_esquizoide_atividades", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_atividades):\u003c/b\u003e\u003cbr\u003eVoc\u00ea quase sempre escolhe atividades que\u003cbr\u003epode fazer completamente sozinho."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_sexo", "label": "q_esquizoide_sexo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_sexo):\u003c/b\u003e\u003cbr\u003eVoc\u00ea possui pouco ou nenhum interesse em\u003cbr\u003eter experi\u00eancias sexuais com outras\u003cbr\u003epessoas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_prazer", "label": "q_esquizoide_prazer", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_prazer):\u003c/b\u003e\u003cbr\u003eNa grande maioria das vezes, voc\u00ea sente\u003cbr\u003epouco ou nenhum prazer nas atividades\u003cbr\u003egerais da vida."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_amigos", "label": "q_esquizoide_amigos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_amigos):\u003c/b\u003e\u003cbr\u003eSem contar seus parentes de primeiro\u003cbr\u003egrau, voc\u00ea n\u00e3o tenho amigos pr\u00f3ximos ou\u003cbr\u003econfidentes."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_indiferenca", "label": "q_esquizoide_indiferenca", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_indiferenca):\u003c/b\u003e\u003cbr\u003eVoc\u00ea parece ser totalmente indiferente\u003cbr\u003etanto aos elogios quanto \u00e0s cr\u00edticas dos\u003cbr\u003eoutros."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_esquizoide_frieza", "label": "q_esquizoide_frieza", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_esquizoide_frieza):\u003c/b\u003e\u003cbr\u003eVoc\u00ea comumente demonstra frieza\u003cbr\u003eemocional, distanciamento cont\u00ednuo e\u003cbr\u003eafeto vazio."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_violacao", "label": "q_antissocial_violacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_violacao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem um padr\u00e3o de desconsiderar e\u003cbr\u003eviolar os direitos das outras pessoas?\u003cbr\u003e(Ex: mentir repetidamente para obter\u003cbr\u003evantagem, agir impulsivamente sem ligar\u003cbr\u003epara a seguran\u00e7a dos outros, ou ter\u003cbr\u003ecomportamentos que s\u00e3o motivos de\u003cbr\u003epris\u00e3o)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_idade", "label": "q_antissocial_idade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_idade):\u003c/b\u003e\u003cbr\u003eAtualmente, voc\u00ea tem 18 anos de idade ou\u003cbr\u003emais."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_inicio", "label": "q_antissocial_inicio", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_inicio):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem hist\u00f3rico de problemas graves\u003cbr\u003ede conduta, agressividade ou desrespeito\u003cbr\u003e\u00e0s regras que come\u00e7ou antes dos 15 anos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_normas", "label": "q_antissocial_normas", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_normas):\u003c/b\u003e\u003cbr\u003eVoc\u00ea fracassa frequentemente em se\u003cbr\u003eadequar \u00e0s normas sociais e legais,\u003cbr\u003ecorrendo risco de ser preso."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_falsidade", "label": "q_antissocial_falsidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_falsidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma mentir repetidamente, usar\u003cbr\u003eapelidos falsos ou enganar os outros\u003cbr\u003epara obter vantagem pessoal."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_impulsividade", "label": "q_antissocial_impulsividade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_impulsividade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea age frequentemente por\u003cbr\u003eimpulsividade e admite uma grande\u003cbr\u003eincapacidade de fazer planos para o\u003cbr\u003efuturo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_agressividade", "label": "q_antissocial_agressividade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_agressividade):\u003c/b\u003e\u003cbr\u003eSua vida \u00e9 marcada por irritabilidade e\u003cbr\u003eagressividade constantes, envolvendo\u003cbr\u003ebrigas ou agress\u00f5es f\u00edsicas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_seguranca", "label": "q_antissocial_seguranca", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_seguranca):\u003c/b\u003e\u003cbr\u003eVoc\u00ea frequentemente desrespeita de\u003cbr\u003emaneira imprudente a sua pr\u00f3pria\u003cbr\u003eseguran\u00e7a ou a das outras pessoas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_irresponsabilidade", "label": "q_antissocial_irresponsabilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_irresponsabilidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea apresenta grande\u003cbr\u003eirresponsabilidade, n\u00e3o conseguindo\u003cbr\u003emanter um trabalho ou pagar suas\u003cbr\u003ed\u00edvidas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_antissocial_remorso", "label": "q_antissocial_remorso", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_antissocial_remorso):\u003c/b\u003e\u003cbr\u003eVoc\u00ea n\u00e3o sente nenhum remorso ou\u003cbr\u003econsegue se justificar facilmente ap\u00f3s\u003cbr\u003eferir, roubar ou enganar algu\u00e9m."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_instabilidade", "label": "q_borderline_instabilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_instabilidade):\u003c/b\u003e\u003cbr\u003eSeu humor muda de forma muito brusca e\u003cbr\u003eintensa no mesmo dia, indo de uma\u003cbr\u003ealegria normal para uma raiva, ansiedade\u003cbr\u003eou tristeza paralisante em quest\u00e3o de\u003cbr\u003ehoras."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_impulsividade", "label": "q_borderline_impulsividade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_impulsividade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea age por impulso em \u00e1reas que podem\u003cbr\u003ete prejudicar seriamente? (Ex: gastar\u003cbr\u003edinheiro sem ter, comer compulsivamente\u003cbr\u003eat\u00e9 passar mal, abuso de \u00e1lcool/drogas,\u003cbr\u003esexo irrespons\u00e1vel ou dire\u00e7\u00e3o perigosa)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_abandono", "label": "q_borderline_abandono", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_abandono):\u003c/b\u003e\u003cbr\u003eVoc\u00ea faz esfor\u00e7os desesperados e at\u00e9\u003cbr\u003eexagerados para evitar ser abandonado,\u003cbr\u003eseja de forma real ou imagin\u00e1ria? (Ex:\u003cbr\u003eimplorar, amea\u00e7ar se machucar ou entrar\u003cbr\u003eem p\u00e2nico extremo se algu\u00e9m demorar a\u003cbr\u003eresponder ou desmarcar um encontro)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_relacionamentos", "label": "q_borderline_relacionamentos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_relacionamentos):\u003c/b\u003e\u003cbr\u003eSeus relacionamentos costumam ir\u003cbr\u003erapidamente da idealiza\u00e7\u00e3o perfeita para\u003cbr\u003ea desvaloriza\u00e7\u00e3o total."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_identidade", "label": "q_borderline_identidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_identidade):\u003c/b\u003e\u003cbr\u003eSua vis\u00e3o de quem voc\u00ea \u00e9 e dos seus\u003cbr\u003evalores \u00e9 muito inst\u00e1vel e muda o tempo\u003cbr\u003etodo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_areas", "label": "q_borderline_areas", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_areas):\u003c/b\u003e\u003cbr\u003eVoc\u00ea age de forma impulsiva em coisas\u003cbr\u003eperigosas como gastos excessivos, sexo\u003cbr\u003esem prote\u00e7\u00e3o, drogas ou dire\u00e7\u00e3o\u003cbr\u003eimprudente."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_suicidio", "label": "q_borderline_suicidio", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_suicidio):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem um hist\u00f3rico de comportamento,\u003cbr\u003eamea\u00e7as ou tentativas de suic\u00eddio, ou\u003cbr\u003ecostuma se automutilar."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_vazio", "label": "q_borderline_vazio", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_vazio):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma lidar com um sentimento\u003cbr\u003ecr\u00f4nico e profundo de vazio existencial."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_raiva", "label": "q_borderline_raiva", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_raiva):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem crises de raiva intensa que s\u00e3o\u003cbr\u003edif\u00edceis de controlar e muitas vezes\u003cbr\u003einadequadas para a situa\u00e7\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_grandiosidade", "label": "q_narcisista_grandiosidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_grandiosidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea frequentemente se sente muito\u003cbr\u003esuperior \u00e0s outras pessoas, com uma\u003cbr\u003egrande fantasia de ser o melhor."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_admiracao", "label": "q_narcisista_admiracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_admiracao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem uma necessidade constante e\u003cbr\u003emuito grande de que as pessoas te\u003cbr\u003eadmirem e te reconhe\u00e7am."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_empatia", "label": "q_narcisista_empatia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_empatia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem dificuldade de se colocar no\u003cbr\u003elugar do outro e de sentir empatia pelos\u003cbr\u003esentimentos alheios."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_autoimportancia", "label": "q_narcisista_autoimportancia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_autoimportancia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem um senso de grandeza,\u003cbr\u003eexagerando constantemente suas\u003cbr\u003econquistas e talentos para parecer\u003cbr\u003esuperior."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_fantasias", "label": "q_narcisista_fantasias", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_fantasias):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se perde frequentemente em\u003cbr\u003efantasias de sucesso ilimitado, poder,\u003cbr\u003ebrilhantismo ou beleza ideal."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_especial", "label": "q_narcisista_especial", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_especial):\u003c/b\u003e\u003cbr\u003eVoc\u00ea acredita que \u00e9 muito especial e que\u003cbr\u003es\u00f3 pessoas de alto n\u00edvel ou institui\u00e7\u00f5es\u003cbr\u003eimportantes podem me compreender."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_exigencia", "label": "q_narcisista_exigencia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_exigencia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea exige que as pessoas te admirem\u003cbr\u003eexcessivamente o tempo todo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_privilegios", "label": "q_narcisista_privilegios", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_privilegios):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente que tenho o direito de\u003cbr\u003ereceber sempre um tratamento\u003cbr\u003eprivilegiado, sem precisar fazer nada em\u003cbr\u003etroca."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_exploracao", "label": "q_narcisista_exploracao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_exploracao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma explorar as pessoas e tirar\u003cbr\u003evantagem delas para atingir os seus\u003cbr\u003epr\u00f3prios objetivos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_narcisista_inveja", "label": "q_narcisista_inveja", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_narcisista_inveja):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente muita inveja das outras\u003cbr\u003epessoas ou acredita frequentemente que\u003cbr\u003eos outros t\u00eam muita inveja de voc\u00ea."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_inibicao", "label": "q_evitativa_inibicao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_inibicao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea evita ao m\u00e1ximo situa\u00e7\u00f5es sociais,\u003cbr\u003efazer novos amigos ou aceitar promo\u00e7\u00f5es\u003cbr\u003eno trabalho por um medo intenso de ser\u003cbr\u003ecriticado, rejeitado ou passar vergonha."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_inadequacao", "label": "q_evitativa_inadequacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_inadequacao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea convive com sentimentos profundos\u003cbr\u003ede que \u00e9 inadequado ou inferior \u00e0s\u003cbr\u003eoutras pessoas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_hipersensibilidade", "label": "q_evitativa_hipersensibilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_hipersensibilidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea \u00e9 extremamente sens\u00edvel a cr\u00edticas\u003cbr\u003eou \u00e0 ideia de ser rejeitado por algu\u00e9m."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_ocupacional", "label": "q_evitativa_ocupacional", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_ocupacional):\u003c/b\u003e\u003cbr\u003eVoc\u00ea evita trabalhos que envolvam\u003cbr\u003econtato com pessoas por medo de ser\u003cbr\u003ecriticado ou rejeitado."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_relutancia", "label": "q_evitativa_relutancia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_relutancia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se recusa a se envolver com as\u003cbr\u003epessoas a menos que tenha certeza\u003cbr\u003eabsoluta de que elas gostam de voc\u00ea."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_intimos", "label": "q_evitativa_intimos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_intimos):\u003c/b\u003e\u003cbr\u003eVoc\u00ea evita intimidade e relacionamentos\u003cbr\u003epr\u00f3ximos porque tem pavor de ser\u003cbr\u003eexposto, ridicularizado ou passar\u003cbr\u003evergonha."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_critica", "label": "q_evitativa_critica", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_critica):\u003c/b\u003e\u003cbr\u003eSua preocupa\u00e7\u00e3o em ser criticado ou\u003cbr\u003erejeitado em intera\u00e7\u00f5es sociais \u00e9 quase\u003cbr\u003euma obsess\u00e3o constante."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_novas_situacoes", "label": "q_evitativa_novas_situacoes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_novas_situacoes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem dificuldade de entrar em novas\u003cbr\u003esitua\u00e7\u00f5es ou lugares por conta de\u003cbr\u003esentimentos de inaptid\u00e3o e inadequa\u00e7\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_visao_si", "label": "q_evitativa_visao_si", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_visao_si):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se v\u00ea constantemente como algu\u00e9m\u003cbr\u003esocialmente inepto, sem encanto pessoal\u003cbr\u003ee inferior aos outros."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_evitativa_riscos", "label": "q_evitativa_riscos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_evitativa_riscos):\u003c/b\u003e\u003cbr\u003eVoc\u00ea evita fortemente assumir qualquer\u003cbr\u003erisco ou iniciar novas atividades para\u003cbr\u003en\u00e3o passar vergonha."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_ordem", "label": "q_tpoc_ordem", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_ordem):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem uma preocupa\u00e7\u00e3o exagerada com a\u003cbr\u003eordem, organiza\u00e7\u00e3o e perfeccionismo em\u003cbr\u003etudo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_flexibilidade", "label": "q_tpoc_flexibilidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_flexibilidade):\u003c/b\u003e\u003cbr\u003eSeu controle e perfeccionismo excessivos\u003cbr\u003efazem com que voc\u00ea perca a flexibilidade\u003cbr\u003ee a efici\u00eancia."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_detalhes", "label": "q_tpoc_detalhes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_detalhes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se preocupa tanto com detalhes,\u003cbr\u003eregras, listas e hor\u00e1rios que acaba\u003cbr\u003eesquecendo o objetivo principal da\u003cbr\u003etarefa."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_perfeccionismo", "label": "q_tpoc_perfeccionismo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_perfeccionismo):\u003c/b\u003e\u003cbr\u003eSeu perfeccionismo \u00e9 t\u00e3o extremo que\u003cbr\u003emuitas vezes te impede de finalizar ou\u003cbr\u003eentregar os trabalhos no prazo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_trabalho", "label": "q_tpoc_trabalho", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_trabalho):\u003c/b\u003e\u003cbr\u003eVoc\u00ea \u00e9 excessivamente devotado ao\u003cbr\u003etrabalho e \u00e0 produtividade, a ponto de\u003cbr\u003eabandonar suas amizades e momentos de\u003cbr\u003elazer."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_moral", "label": "q_tpoc_moral", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_moral):\u003c/b\u003e\u003cbr\u003eVoc\u00ea \u00e9 extremamente r\u00edgido e inflex\u00edvel\u003cbr\u003eno que diz respeito \u00e0 moral, valores e\u003cbr\u003equest\u00f5es \u00e9ticas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_descartar", "label": "q_tpoc_descartar", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_descartar):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem muita dificuldade ou \u00e9 incapaz\u003cbr\u003ede jogar fora objetos velhos e sem\u003cbr\u003evalor, mesmo que n\u00e3o tenham significado\u003cbr\u003eafetivo."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_delegar", "label": "q_tpoc_delegar", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_delegar):\u003c/b\u003e\u003cbr\u003eVoc\u00ea se recusa a delegar tarefas ou\u003cbr\u003etrabalhar em grupo a n\u00e3o ser que as\u003cbr\u003epessoas fa\u00e7am exatamente do seu jeito."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tpoc_avareza", "label": "q_tpoc_avareza", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tpoc_avareza):\u003c/b\u003e\u003cbr\u003eVoc\u00ea \u00e9 muito \u0027p\u00e3o-duro\u0027 e adota um\u003cbr\u003eestilo avarento de lidar com o dinheiro,\u003cbr\u003eguardando excessivamente para evitar\u003cbr\u003efuturas cat\u00e1strofes imagin\u00e1rias."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_padrao", "label": "q_tdah_padrao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_padrao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma deixar tarefas pela metade,\u003cbr\u003epular de um interesse para outro\u003cbr\u003erapidamente e lutar muito contra o t\u00e9dio\u003cbr\u003epara terminar obriga\u00e7\u00f5es di\u00e1rias (como\u003cbr\u003eler um texto longo ou organizar o\u003cbr\u003equarto)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_prejuizo", "label": "q_tdah_prejuizo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_prejuizo):\u003c/b\u003e\u003cbr\u003eEsses sintomas de desaten\u00e7\u00e3o ou\u003cbr\u003ehiperatividade prejudicam fortemente seu\u003cbr\u003erendimento no trabalho, estudos ou\u003cbr\u003erelacionamentos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_infancia", "label": "q_tdah_infancia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_infancia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea apresentava v\u00e1rios sintomas de\u003cbr\u003edistra\u00e7\u00e3o ou agita\u00e7\u00e3o antes dos 12 anos\u003cbr\u003ede idade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_desatencao", "label": "q_tdah_desatencao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_desatencao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem dificuldade cr\u00f4nica de manter o\u003cbr\u003efoco em tarefas n\u00e3o estimulantes? (Ex:\u003cbr\u003ecomete erros por descuido, perde\u003cbr\u003echaves/celular com frequ\u00eancia, sua mente\u003cbr\u003e\u0027viaja\u0027 ou parece que n\u00e3o escuta quando\u003cbr\u003efalam diretamente com voc\u00ea)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_escuta", "label": "q_tdah_escuta", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_escuta):\u003c/b\u003e\u003cbr\u003eAs pessoas frequentemente reclamam que\u003cbr\u003evoc\u00ea parece n\u00e3o escutar quando falam com\u003cbr\u003evoc\u00ea ou que n\u00e3o segue as instru\u00e7\u00f5es at\u00e9\u003cbr\u003eo fim."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_organizacao", "label": "q_tdah_organizacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_organizacao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem muita dificuldade em se\u003cbr\u003eorganizar ou evita tarefas que exigem\u003cbr\u003eesfor\u00e7o mental prolongado."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_perdas", "label": "q_tdah_perdas", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_perdas):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma perder coisas importantes\u003cbr\u003epara o dia a dia e \u00e9 frequentemente\u003cbr\u003eesquecido na sua rotina."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_agita", "label": "q_tdah_agita", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_agita):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente necessidade de batucar,\u003cbr\u003ebalan\u00e7ar as pernas ou levantar da\u003cbr\u003ecadeira em situa\u00e7\u00f5es onde deveria ficar\u003cbr\u003eparado."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_corre", "label": "q_tdah_corre", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_corre):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem uma sensa\u00e7\u00e3o constante de\u003cbr\u003einquietude, como se estivesse sempre\u003cbr\u003eligado por um motor."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_fala", "label": "q_tdah_fala", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_fala):\u003c/b\u003e\u003cbr\u003eVoc\u00ea fala excessivamente, responde\u003cbr\u003eimpulsivamente antes de ouvir a pergunta\u003cbr\u003etoda ou interrompe muito as pessoas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_comunicacao", "label": "q_tea_comunicacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_comunicacao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea frequentemente acha dif\u00edcil\u003cbr\u003eentender o tom de voz das pessoas,\u003cbr\u003eironias, ou percebe que os outros te\u003cbr\u003eacham \u0027grosseiro(a)\u0027 ou \u0027estranho(a)\u0027\u003cbr\u003enas conversas, mesmo voc\u00ea n\u00e3o tendo a\u003cbr\u003einten\u00e7\u00e3o."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_padroes", "label": "q_tea_padroes", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_padroes):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem comportamentos, rotinas ou\u003cbr\u003einteresses muito repetitivos e\u003cbr\u003erestritos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_infancia", "label": "q_tea_infancia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_infancia):\u003c/b\u003e\u003cbr\u003eEssas dificuldades sociais ou\u003cbr\u003ecomportamentos restritos est\u00e3o presentes\u003cbr\u003edesde a sua inf\u00e2ncia."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_reciprocidade", "label": "q_tea_reciprocidade", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_reciprocidade):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem dificuldade em conversar\u003cbr\u003enaturalmente numa roda ou em\u003cbr\u003ecompartilhar sentimentos e interesses\u003cbr\u003ecom as outras pessoas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_naoverbal", "label": "q_tea_naoverbal", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_naoverbal):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem dificuldade em entender a\u003cbr\u003elinguagem corporal, gestos ou tem pouco\u003cbr\u003econtato visual durante as conversas."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_relacionamentos", "label": "q_tea_relacionamentos", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_relacionamentos):\u003c/b\u003e\u003cbr\u003eVoc\u00ea acha muito dif\u00edcil desenvolver,\u003cbr\u003emanter ou entender relacionamentos de\u003cbr\u003eamizade apropriados para a sua idade."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_estereotipias", "label": "q_tea_estereotipias", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_estereotipias):\u003c/b\u003e\u003cbr\u003eVoc\u00ea frequentemente faz movimentos\u003cbr\u003erepetitivos com o corpo ou m\u00e3os, ou\u003cbr\u003erepete muito certas palavras e frases."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_rotina", "label": "q_tea_rotina", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_rotina):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente um inc\u00f4modo enorme com\u003cbr\u003equebras de rotina, sendo muito\u003cbr\u003einflex\u00edvel a mudan\u00e7as no seu dia a dia."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_interesses", "label": "q_tea_interesses", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_interesses):\u003c/b\u003e\u003cbr\u003eVoc\u00ea possui interesses altamente fixos e\u003cbr\u003eanormais na intensidade, focando\u003cbr\u003eobsessivamente em assuntos espec\u00edficos."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_sensorial", "label": "q_tea_sensorial", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_sensorial):\u003c/b\u003e\u003cbr\u003eVoc\u00ea \u00e9 extremamente sens\u00edvel (ou\u003cbr\u003einsens\u00edvel) a sons, luzes, texturas de\u003cbr\u003eroupa ou certos cheiros no ambiente."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_vazio_cronico", "label": "q_borderline_vazio_cronico", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_vazio_cronico):\u003c/b\u003e\u003cbr\u003eVoc\u00ea frequentemente sente um \u0027vazio\u0027\u003cbr\u003eenorme por dentro, como se n\u00e3o soubesse\u003cbr\u003equem voc\u00ea realmente \u00e9 ou o que quer da\u003cbr\u003evida."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_automutilacao", "label": "q_borderline_automutilacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_automutilacao):\u003c/b\u003e\u003cbr\u003eQuando a dor emocional \u00e9 muito forte,\u003cbr\u003evoc\u00ea j\u00e1 se cortou, se machucou de\u003cbr\u003eprop\u00f3sito ou amea\u00e7ou tirar a pr\u00f3pria\u003cbr\u003evida."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_borderline_idealizacao", "label": "q_borderline_idealizacao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_borderline_idealizacao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea costuma idolatrar uma pessoa\u003cbr\u003erapidamente no in\u00edcio da rela\u00e7\u00e3o, mas\u003cbr\u003epouco tempo depois passa a odi\u00e1-la ou\u003cbr\u003each\u00e1-la p\u00e9ssima por uma pequena falha."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tdah_paralisia", "label": "q_tdah_paralisia", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tdah_paralisia):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sofre de \u0027paralisia de tarefas\u0027,\u003cbr\u003eonde quer muito fazer algo importante\u003cbr\u003emas seu c\u00e9rebro simplesmente n\u00e3o deixa\u003cbr\u003evoc\u00ea come\u00e7ar."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_tea_masking", "label": "q_tea_masking", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_tea_masking):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente que precisa criar um\u003cbr\u003e\u0027personagem\u0027 ou for\u00e7ar contato visual\u003cbr\u003epara parecer normal perto das outras\u003cbr\u003epessoas, o que te deixa exausto(a)."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_disforia_rejeicao", "label": "q_disforia_rejeicao", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_disforia_rejeicao):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente uma dor emocional extrema e\u003cbr\u003edesproporcional quando acha que algu\u00e9m\u003cbr\u003ete rejeitou, ignorou ou criticou."}, {"color": "#33FF57", "font": {"color": "white"}, "id": "q_desregulacao_emocional", "label": "q_desregulacao_emocional", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_desregulacao_emocional):\u003c/b\u003e\u003cbr\u003eVoc\u00ea tem muita dificuldade de controlar\u003cbr\u003esuas emo\u00e7\u00f5es, passando rapidamente de\u003cbr\u003eestar bem para acessos de raiva ou choro\u003cbr\u003eintenso."}, {"color": "#33FF57", "font": {"color": "white"}, "id": "q_isolamento_social_extremo", "label": "q_isolamento_social_extremo", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_isolamento_social_extremo):\u003c/b\u003e\u003cbr\u003eVoc\u00ea prefere ficar completamente\u003cbr\u003eisolado(a) e tem pouqu\u00edssimo ou nenhum\u003cbr\u003einteresse em intera\u00e7\u00f5es sociais."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_mente_acelerada_noturna", "label": "q_mente_acelerada_noturna", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_mente_acelerada_noturna):\u003c/b\u003e\u003cbr\u003eSua mente fica t\u00e3o acelerada \u00e0 noite com\u003cbr\u003epensamentos que \u00e9 quase imposs\u00edvel\u003cbr\u003econseguir desligar para dormir."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_rigidez_mudancas", "label": "q_rigidez_mudancas", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_rigidez_mudancas):\u003c/b\u003e\u003cbr\u003eVoc\u00ea sente um desconforto ou irrita\u00e7\u00e3o\u003cbr\u003emuito forte quando seus planos ou sua\u003cbr\u003erotina precisam ser mudados de \u00faltima\u003cbr\u003ehora."}, {"color": "#33C3FF", "font": {"color": "white"}, "id": "q_hiperfoco_intenso", "label": "q_hiperfoco_intenso", "shape": "ellipse", "title": "\u003cb\u003ePERGUNTA (q_hiperfoco_intenso):\u003c/b\u003e\u003cbr\u003e
